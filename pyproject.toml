[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-radar"
version = "0.1.0"
description = "PR dependency DAGs, collision radar, change-risk scoring, and review-flow tracking for high-velocity OSS (vLLM, SGLang)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["pr_radar*"]

[tool.setuptools.package-data]
pr_radar = ["web/*.html"]

[project.scripts]
pr-radar = "pr_radar.cli:main"

