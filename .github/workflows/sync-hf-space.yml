name: Sync vLLM PR Radar Snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-space:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: data
          key: vllm-pr-cache-${{ github.run_id }}
          restore-keys: vllm-pr-cache-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -U huggingface_hub

      - name: Sync vLLM PRs and export static bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pr_radar.cli sync --repo vllm-project/vllm --limit 0
          python3 -m pr_radar.cli export-site --repo vllm-project/vllm --out dist_hf

      - name: Publish static bundle to static-site branch (Vercel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmpdir=$(mktemp -d)
          cp -a dist_hf/. "$tmpdir/"
          git -C "$tmpdir" init -b static-site
          git -C "$tmpdir" config user.name "github-actions[bot]"
          git -C "$tmpdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmpdir" add -A
          git -C "$tmpdir" commit -m "Refresh vLLM PR Radar static snapshot"
          git -C "$tmpdir" push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/static-site

      - name: Upload bundle to Hugging Face Static Space
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo "${HF_TOKEN:-}" | tr -d '"'"'"' | xargs)
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "HF_TOKEN secret is not set; skipping Hugging Face upload."
            exit 0
          fi
          export CLEAN_TOKEN
          python3 -c "import os; from huggingface_hub import HfApi; token = os.environ.get('CLEAN_TOKEN'); HfApi(token=token).upload_folder(folder_path='dist_hf', repo_id='Aravind0495/vllm-pr-radar', repo_type='space', token=token, commit_message='Refresh vLLM PR Radar snapshot')"
